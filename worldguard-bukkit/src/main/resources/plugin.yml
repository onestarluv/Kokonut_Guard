name: Kokonut_Guard
author: pingpong
description: 에고버스 플러그인
website: https://wiki.egoverse.kr
provides: [WorldGuard]
main: com.sk89q.worldguard.bukkit.WorldGuardPlugin
# MythicMobs는 이 파일에서 "version"으로 시작하는 첫 줄의 11번째 글자를 WorldGuard 주 버전(7)으로 읽는다.
# 실제 버전(cbt-1.0)은 아래 version 이고, versionW 는 Paper가 무시하는 MythicMobs 호환용 줄이다.
versionW: 7
version: "${pluginVersion}"
depend: [WorldEdit]
api-version: "26.3"
load: POSTWORLD
folia-supported: true
commands:
  영역:
    description: 영역 관리 및 설정 GUI
    usage: /영역 [설정 [영역이름]|생성|정보|목록|플래그]
    aliases: [지역, 보호구역]
